name: Sync atividades

# Roda 1x/dia (Fase 8 -- ver docs/CASE_DO_PROJETO_1.md seção 7). Horário em UTC:
# GitHub Actions cron não entende fuso -- 21h BRT = 00h UTC do dia seguinte.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  # Permite analise_semanal.yml chamar este workflow (reusable workflow) em
  # vez de duplicar os mesmos 4 passos de carga de dado.
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: sync-atividades
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GOOGLE_SHEETS_CREDENTIALS_PATH: .google_sheets_credentials.json
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      # E-mail de lembrete de treino pendente (Fase 9, planilha_desempenho).
      # Sem estas três, o lembrete dava KeyError e o retry do passo escondia
      # a falha: na 2ª tentativa o dia já estava resolvido e nada era enviado.
      EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
      EMAIL_SENHA_APP: ${{ secrets.EMAIL_SENHA_APP }}
      EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
      # Amostras de domínio (sono, sessões, semana) no log de monitoramento:
      # variável do repositório MONITORAMENTO_AMOSTRAS=0 desliga (o log de
      # operação continua) -- ver src/monitoramento.py, privacidade.
      MONITORAMENTO_AMOSTRAS: ${{ vars.MONITORAMENTO_AMOSTRAS || '1' }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --frozen

      # Monitoramento (monitoring/README.md): o log append-only vem da
      # execução anterior pelo cache (a VM do Actions some no fim do job) --
      # chave única por run/job; restore-keys pega a mais recente.
      - name: Restaurar log de monitoramento
        uses: actions/cache/restore@v4
        with:
          path: logs
          key: monitoramento-${{ github.run_id }}-${{ github.run_attempt }}-sync
          restore-keys: monitoramento-

      - name: Restaurar credencial do Google Sheets
        run: printf '%s' "$GOOGLE_SHEETS_CREDENTIALS_JSON" > .google_sheets_credentials.json
        env:
          GOOGLE_SHEETS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}

      # Cada passo abaixo tenta de novo (2x, 60/30s de espera) antes de
      # falhar de vez -- só aí o job falha e o GitHub manda o e-mail padrão
      # de workflow agendado que falhou.
      - name: Carregar atividades
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 60
          command: uv run python -m src.load.load_atividades

      - name: Carregar recuperação
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 60
          command: uv run python -m src.load.load_recuperacao

      - name: Sincronizar dor (planilha)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 30
          command: uv run python -m src.load.load_dor

      - name: Atualizar dashboard da planilha
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 30
          command: uv run python -m src.load.planilha_desempenho

      # Mesmo com etapa falhando (if: always): o log de uma execução que
      # falhou é justamente o que mais interessa. Resumo + .prom só com
      # biblioteca padrão; o artifact leva o log acumulado inteiro.
      - name: Resumo do monitoramento
        if: always()
        run: uv run --no-sync python monitoring/resumo.py --log logs --saida monitoring_out

      - name: Salvar log de monitoramento
        if: always()
        uses: actions/cache/save@v4
        with:
          path: logs
          key: monitoramento-${{ github.run_id }}-${{ github.run_attempt }}-sync

      - name: Publicar artifact de monitoramento
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitoramento-sync-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/
            monitoring_out/
          retention-days: 30
          if-no-files-found: warn
