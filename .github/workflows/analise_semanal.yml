name: Análise semanal

# Roda sábado à tarde (Fase 8 -- ver docs/CASE_DO_PROJETO_1.md seção 7). O job
# "sync" chama sync_atividades.yml como reusable workflow (workflow_call) em
# vez de duplicar os mesmos 4 passos de carga de dado -- isso também resolve
# o problema de a análise pegar dado desatualizado por coincidência de
# horário: ela sincroniza na própria execução, não depende do cron diário já
# ter rodado antes.
# Sábado 17h17 BRT = 20h17 UTC, com reserva às 21h17 BRT (00h17 UTC de
# domingo). O agendamento do GitHub atrasa sistematicamente 4-7 h (o cron de
# domingo 6h só rodava perto das 10h, e o corredor acordava sem plano), então
# o plano sai na véspera, com folga -- mesmo 7 h atrasado, fica pronto antes
# de domingo de manhã. Minuto 17, não hora cheia: o GitHub recomenda evitar o
# início da hora, quando a fila de agendamento congestiona. O plano é da
# semana que começa no domingo seguinte (semana.semana_alvo); a reserva vê a
# semana já escrita e sai sem fazer nada. A sessão de sábado é proibida na
# retomada, então a semana anterior já está completa no sábado à tarde.
on:
  schedule:
    - cron: "17 20 * * 6"
    - cron: "17 0 * * 0"
  workflow_dispatch:
    inputs:
      semana:
        description: "Semana a planejar (atual = a semana já começada, quando o cron falhou; dias passados viram descanso)"
        type: choice
        options: [proxima, atual]
        default: proxima
      forcar:
        description: "Gerar um plano novo mesmo se a semana já tem plano (substitui planilha e treinos do relógio)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: analise-semanal
  cancel-in-progress: false

jobs:
  sync:
    uses: ./.github/workflows/sync_atividades.yml
    secrets: inherit

  analisar:
    needs: sync
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
      GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
      GOOGLE_SHEETS_CREDENTIALS_PATH: .google_sheets_credentials.json
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
      EMAIL_SENHA_APP: ${{ secrets.EMAIL_SENHA_APP }}
      EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
      SEMANA_PLANO: ${{ inputs.semana }}
      FORCAR_REGERAR: ${{ inputs.forcar }}
    steps:
      # Job novo, VM nova -- reusable workflow não compartilha filesystem
      # entre jobs, então o ambiente (checkout, Python, token, credencial)
      # precisa ser preparado de novo aqui. O que foi eliminado é a
      # duplicação dos passos de carga de dado em si (job "sync" acima).
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --frozen

      - name: Restaurar token da Garmin
        run: |
          mkdir -p .garmin_tokens
          printf '%s' "$GARMIN_TOKEN" > .garmin_tokens/garmin_tokens.json
        env:
          GARMIN_TOKEN: ${{ secrets.GARMIN_TOKEN }}

      - name: Restaurar credencial do Google Sheets
        run: printf '%s' "$GOOGLE_SHEETS_CREDENTIALS_JSON" > .google_sheets_credentials.json
        env:
          GOOGLE_SHEETS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}

      # Espera crescente (1, 3 e 7 min) em vez do retry de espera fixa: o 503
      # do Gemini ("high demand") dura mais que os 30s que o nick-fields/retry
      # dava entre tentativas (ver docs/CASE_DO_PROJETO_1.md, 2026-09-21).
      # 4 tentativas no total; a última (espera 0) não dorme depois de falhar.
      # Cada tentativa já passa pelos modelos de reserva (MODELOS_RESERVA),
      # por isso 15 min por tentativa (eram 5, e uma tentativa estourou).
      - name: Gerar análise semanal
        run: |
          for espera in 60 180 420 0; do
            if timeout 900 uv run python -m src.analyze.analisar_com_ia; then
              exit 0
            fi
            if [ "$espera" -gt 0 ]; then
              echo "::warning::Tentativa falhou, nova tentativa em ${espera}s"
              sleep "$espera"
            fi
          done
          echo "::error::Análise semanal falhou em todas as tentativas"
          exit 1
